services:
  - type: web
    name: madarsa-admin-dashboard
    runtime: python
    buildCommand: "pip install -r admin/requirements.txt"
    startCommand: "gunicorn --chdir admin app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
