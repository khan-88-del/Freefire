name: Build TV Sandbox Mapper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clone & Patch NewBlackbox Bcore
        run: |
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git temp_nb
          mv temp_nb/Bcore ./Bcore
          rm -rf temp_nb
          # Ensure namespace & SDK compatibility in Bcore/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 33/g' Bcore/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 30/g' Bcore/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 26/g' Bcore/build.gradle || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Sandbox-Mapper-APK
          path: app/build/outputs/apk/debug/*.apk
