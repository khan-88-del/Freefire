name: Build TV Sandbox Mapper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "cmake;3.18.1" "platforms;android-33" "build-tools;33.0.2"

      - name: Merge Our App into NewBlackbox Build System
        run: |
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git temp_nb
          # Copy NewBlackbox's working modules, gradle wrapper & settings
          rm -rf temp_nb/app
          cp -r temp_nb/* ./
          rm -rf temp_nb
          # Ensure ':app' is included in NewBlackbox's settings.gradle
          grep -q "include ':app'" settings.gradle || echo "include ':app'" >> settings.gradle
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/3.18.1" >> local.properties

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Sandbox-Mapper-APK
          path: app/build/outputs/apk/debug/*.apk
