name: Build TV Sandbox Mapper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK Licenses & Install Required NDK 29
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Merge Our App into NewBlackbox Build System
        run: |
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git temp_nb
          rm -rf temp_nb/app
          cp -r temp_nb/* ./
          rm -rf temp_nb
          grep -q "include ':app'" settings.gradle || echo "include ':app'" >> settings.gradle

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Sandbox-Mapper-APK
          path: app/build/outputs/apk/debug/*.apk
