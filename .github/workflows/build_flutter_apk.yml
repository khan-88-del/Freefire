name: Build Flutter Madarsa APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Scaffold Android
        run: |
          rm -rf android
          flutter create . --project-name=madarsa_app --platforms=android --org=com.madarsa.app


          # Duplicate resource error से बचने के लिए anydpi-v26 से png फ़ाइल हटाएं
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.png

          # Base density folders में package installer के लिए PNG को सही रखें
          for density in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            if [ -d "$dir" ]; then
              cp assets/icon.png "$dir/ic_launcher.png"
              cp assets/icon.png "$dir/ic_launcher_round.png"
            fi
          done

      - name: Build Android APK
      - name: Setup App Icons
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons

        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madarsa-App-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
