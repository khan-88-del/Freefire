name: Build Flutter Madarsa APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Scaffold Android
        run: |
          rm -rf android
          flutter create . --project-name=madarsa_app --platforms=android --org=com.madarsa.app

      - name: Force Replace All Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

          # Package Installer के लिए हर mipmap फोल्डर में ic_launcher.png को आपके लोगो से ओवरराइट करें
          for dir in android/app/src/main/res/mipmap-*; do
            cp assets/icon.png "$dir/ic_launcher.png" 2>/dev/null || true
            cp assets/icon.png "$dir/ic_launcher_round.png" 2>/dev/null || true
          done

          # AndroidManifest.xml में icon और roundIcon दोनों को सुनिश्चित करें
          sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madarsa-App-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
