<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Class - Madarsa Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: sans-serif; }
        .bg-madarsa { background-color: #0F5132; color: white; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-madarsa py-3 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="/">Jamia Samadiya Admin</a>
        <div class="ms-auto">
            <a href="/syllabus/classes" class="btn btn-outline-light btn-sm me-2">&larr; All Classes</a>
            <a href="/" class="btn btn-outline-light btn-sm">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container my-5" style="max-width: 600px;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-madarsa py-3">
            <h5 class="mb-0 fw-bold text-white"><i class="bi bi-folder-plus me-2"></i>Create New Syllabus Class</h5>
        </div>
        <div class="card-body p-4">
            <form id="createClassForm" onsubmit="handleCreateClass(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold">Class Name (Urdu / English)</label>
                    <input type="text" id="class_name" name="class_name" class="form-control" placeholder="e.g. جماعة ثالثہ / Darse Nizami Year 1" required>
                </div>
                <hr>
                <h6 class="fw-bold text-muted mb-3"><i class="bi bi-file-earmark-pdf me-1"></i>Attach Initial PDF (Optional)</h6>
                <div class="mb-3">
                    <label class="form-label">PDF Title</label>
                    <input type="text" id="pdf_title" name="pdf_title" class="form-control" placeholder="Book / Subject name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Select PDF File</label>
                    <input type="file" id="pdf_file" name="pdf_file" class="form-control" accept="application/pdf">
                </div>

                <!-- Progress Bar -->
                <div id="classProgressBox" class="mt-3" style="display: none;">
                    <label class="form-label small fw-bold text-success mb-1" id="classStatusLabel">Creating class & uploading...</label>
                    <div class="progress" style="height: 14px; border-radius: 8px;">
                        <div id="classProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 0%;"></div>
                    </div>
                    <div class="d-flex justify-content-between small text-muted mt-1">
                        <span id="classPercentText">0%</span>
                        <span id="classBytesText">Please wait...</span>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" id="createBtn" class="btn btn-success fw-bold py-2" style="background-color: #0F5132;">
                        <i class="bi bi-check-circle-fill me-1"></i> Create Class & Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function handleCreateClass(e) {
    e.preventDefault();

    const form = document.getElementById('createClassForm');
    const createBtn = document.getElementById('createBtn');
    const fileInput = document.getElementById('pdf_file');
    const progressBox = document.getElementById('classProgressBox');
    const progressBar = document.getElementById('classProgressBar');
    const percentText = document.getElementById('classPercentText');
    const statusLabel = document.getElementById('classStatusLabel');
    const bytesText = document.getElementById('classBytesText');

    const formData = new FormData(form);

    createBtn.disabled = true;
    progressBox.style.display = 'block';

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/syllabus/create-class', true);

    xhr.upload.onprogress = function(event) {
        if (event.lengthComputable) {
            const percent = Math.round((event.loaded / event.total) * 100);
            progressBar.style.width = percent + '%';
            percentText.innerText = percent + '%';

            const loadedMB = (event.loaded / (1024 * 1024)).toFixed(1);
            const totalMB = (event.total / (1024 * 1024)).toFixed(1);
            bytesText.innerText = `${loadedMB} MB / ${totalMB} MB`;

            if (percent === 100) {
                statusLabel.innerText = 'Uploaded! Registering class in database...';
            }
        }
    };

    xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
            statusLabel.innerText = 'Kamyabi! Redirecting...';
            window.location.href = '/syllabus/classes';
        } else {
            alert('Error creating class: ' + xhr.status);
            createBtn.disabled = false;
            progressBox.style.display = 'none';
        }
    };

    xhr.onerror = function() {
        alert('Network Error!');
        createBtn.disabled = false;
        progressBox.style.display = 'none';
    };

    xhr.send(formData);
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
