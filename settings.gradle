pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "TVSandboxMapper"
include ':app'

// Automatically include all cloned NewBlackbox modules (Bcore, black-reflection, compiler, etc.)
rootDir.eachDir { dir ->
    if (dir.name != 'app' && !dir.name.startsWith('.') && new File(dir, 'build.gradle').exists()) {
        include ":${dir.name}"
    }
}
