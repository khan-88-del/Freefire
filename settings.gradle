pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "TVSandboxMapper"
include ':app'
if (file('Bcore').exists()) include ':Bcore'
if (file('black-reflection').exists()) include ':black-reflection'
if (file('android-mirror').exists()) include ':android-mirror'
